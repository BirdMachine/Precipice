name: Android CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile and lint without secrets
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace
      - name: Upload unsigned PR compile check
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: precipice-unsigned-compile-check
          path: app/build/outputs/apk/debug/app-debug-unsigned.apk
          if-no-files-found: error
      - name: Load the fixed private test signer
        if: github.event_name != 'pull_request'
        env:
          SIGNING_RECORD: ${{ secrets.PRECIPICE_TEST_SIGNING }}
        run: python3 scripts/restore-ci-signing.py
      - name: Build installable APK
        if: github.event_name != 'pull_request'
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify fixed certificate and package
        if: github.event_name != 'pull_request'
        run: scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk "$ANDROID_SDK_ROOT/build-tools/37.0.0"
      - name: Upload verified APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: precipice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Remove private signing material
        if: always()
        run: rm -rf .signing
