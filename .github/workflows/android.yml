name: Android CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Restore stable development signer
        run: |
          mkdir -p .signing
          base64 -d .github/precipice-debug.keystore.b64 > .signing/precipice-debug.p12
          cat > .signing/signing.properties <<'EOF'
          PRECIPICE_KEYSTORE=.signing/precipice-debug.p12
          PRECIPICE_STORE_PASSWORD=precipice-debug
          PRECIPICE_KEY_PASSWORD=precipice-debug
          PRECIPICE_KEY_ALIAS=precipice-debug
          EOF
      - name: Build, test and lint
        run: |
          VERSION_CODE=$((400000 + GITHUB_RUN_NUMBER))
          gradle :app:testDebugUnitTest :app:assembleDebug :app:lintDebug -PprecipiceVersionCode="$VERSION_CODE" --stacktrace
      - name: Verify stable certificate and package
        run: scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk "$ANDROID_SDK_ROOT/build-tools/37.0.0"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: precipice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Remove reconstructed signing material
        if: always()
        run: rm -rf .signing
